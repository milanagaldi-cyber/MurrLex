<nav id="scene-navigation-{{ nav_position }}" class="scene-navigation" aria-label="Scene navigation">
  <a class="icon-button{% if not previous_scene %} disabled{% endif %}"{% if previous_scene %} href="{% url 'studio:scene_detail' previous_scene.id %}?focus={{ nav_position }}#scene-navigation-{{ nav_position }}"{% endif %} title="Previous scene" aria-label="Previous scene">&larr;</a>
  <div class="scene-number-links">{% for item in episode_scenes %}<a class="scene-number{% if item.id == scene.id %} active{% endif %}" href="{% url 'studio:scene_detail' item.id %}?focus={{ nav_position }}#scene-navigation-{{ nav_position }}" title="{{ item.title }}">{{ forloop.counter }}</a>{% endfor %}<a class="icon-button{% if not next_scene %} disabled{% endif %}"{% if next_scene %} href="{% url 'studio:scene_detail' next_scene.id %}?focus={{ nav_position }}#scene-navigation-{{ nav_position }}"{% endif %} title="Next scene" aria-label="Next scene">&rarr;</a></div>
  {% if can_edit %}<a class="button secondary" href="{% url 'studio:scene_create' scene.episode.id %}">+ Create scene</a>{% endif %}
</nav>
