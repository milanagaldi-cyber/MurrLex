{% load studio_extras %}
<style>
  .video-gallery-grid{align-items:start}.video-gallery-card{display:grid;grid-template-rows:auto minmax(112px,auto);min-height:0;overflow:hidden}
  .video-gallery-preview,.video-gallery-processing{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1/1;overflow:hidden;border:0;border-radius:0;background:#05080d;color:#fff;padding:0}
  .video-gallery-card[data-preview-shape="vertical"] .video-gallery-preview,.video-gallery-card[data-preview-shape="vertical"] .video-gallery-processing{aspect-ratio:3/4}
  .video-gallery-card[data-preview-shape="horizontal"] .video-gallery-preview,.video-gallery-card[data-preview-shape="horizontal"] .video-gallery-processing{aspect-ratio:4/3}
  .video-gallery-preview video{display:block;width:100%;height:100%;object-fit:cover}.video-gallery-preview>span{position:absolute;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.62);font-size:19px}
  .video-gallery-card figcaption{display:flex;flex-direction:column;min-height:112px}.video-gallery-card .asset-actions{margin-top:auto}
  .video-add-tile{position:relative;z-index:1;overflow:hidden}.video-add-tile input{display:none!important}.video-add-tile::after{content:"Drop files here";position:absolute;left:50%;bottom:10px;translate:-50% 4px;opacity:0;color:var(--muted);font-size:11px;white-space:nowrap;transition:.15s}.video-add-tile:hover::after,.video-add-tile.file-drop-active::after{translate:-50% 0;opacity:1}
  .video-upload-placeholder{display:grid;grid-template-rows:auto 1fr;min-height:260px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);overflow:hidden}
  .video-upload-placeholder-preview{position:relative;display:grid;place-items:center;aspect-ratio:1/1;background:#071018}.video-upload-placeholder-copy{display:grid;gap:8px;padding:10px}.video-upload-progress{height:5px;overflow:hidden;border-radius:3px;background:var(--line)}.video-upload-progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}
  .asset-context-menu{position:fixed;z-index:200;display:grid;min-width:170px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:0 12px 32px rgba(0,0,0,.35)}.asset-context-menu[hidden]{display:none}.asset-context-menu button,.asset-context-menu a{justify-content:flex-start;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--ink);text-align:left;text-decoration:none}.asset-context-menu button:hover,.asset-context-menu a:hover{background:var(--panel-2)}
  .video-gallery-card form[action*="/detach/"]{display:none!important}
</style>
<details class="media-library video-library" id="{{ video_gallery_id|default:'videos' }}" data-video-library data-current-project="{{ project.id|default:'' }}" open>
  <summary class="media-library-toolbar">
    <span class="media-library-title"><span class="disclosure-icon" aria-hidden="true">&#9662;</span>{{ video_gallery_title|default:'Videos' }} <span class="media-count" data-video-count>{{ gallery_videos|length }}</span></span>
    <span class="media-library-controls">
      <label class="compact-control">Sort<select data-video-sort><option value="newest">Recently added</option><option value="alpha">A-Z</option></select></label>
      {% if video_gallery_mode == 'project' %}<label class="compact-control">Source<select data-video-source><option value="current">Current Project</option><option value="workspace">Workspace</option><option value="recent">Last 10 in Project</option><option value="starred">Favorite</option><option value="generated">Generated</option></select></label>{% else %}<label class="compact-control">Project<select data-video-source><option value="workspace">Workspace</option><option value="starred">Favorite</option><option value="generated">Generated</option>{% for item in gallery_projects %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</select></label>{% endif %}
      <label class="compact-control">Format<select data-video-orientation><option value="all">All formats</option><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option><option value="square">Square</option></select></label>
      <label class="compact-control">Preview<select data-video-shape><option value="auto">Auto</option><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option><option value="square">Square</option></select></label>
      <span class="view-switch" data-view-switch="video-{{ video_gallery_id|default:'videos' }}"><button type="button" class="icon-button" data-view="large" title="Large videos" aria-label="Large videos">&#x25A6;</button><button type="button" class="icon-button" data-view="small" title="Small videos" aria-label="Small videos">&#x25A5;</button></span>
    </span>
  </summary>
  <div class="project-section-body"><div class="asset-grid media-grid video-gallery-grid large" data-view-container="video-{{ video_gallery_id|default:'videos' }}" data-video-grid>
    {% if can_edit %}<label class="asset-add-tile video-add-tile" title="Add Video; you can also drop files here"><span aria-hidden="true">+</span><small>Add Video</small><input type="file" accept="video/*" multiple data-direct-media-input hidden></label>{% endif %}
    {% for asset in gallery_videos %}<figure class="asset video-gallery-card" data-video-item data-asset-id="{{ asset.id }}" data-created="{{ asset.created_at|date:'U' }}" data-name="{{ asset.original_filename|lower }}" data-projects=",{{ asset.gallery_project_ids }}," data-starred="{% if asset.is_starred %}1{% else %}0{% endif %}" data-generated="{% if asset.kind == 'GENERATION_OUTPUT' %}1{% else %}0{% endif %}" data-orientation="{% if asset.width and asset.height %}{% if asset.height > asset.width %}portrait{% elif asset.width > asset.height %}landscape{% else %}square{% endif %}{% else %}square{% endif %}" data-native-orientation="{% if asset.width and asset.height %}{% if asset.height > asset.width %}portrait{% elif asset.width > asset.height %}landscape{% else %}square{% endif %}{% else %}square{% endif %}" title="{{ asset.width|default:'?' }}x{{ asset.height|default:'?' }} / {{ asset.size_bytes|filesizeformat }} / {{ asset.gallery_project_names }}"{% if video_gallery_mode == 'project' and not asset.is_current_project %} hidden{% endif %}>
      {% if asset.processing_status == 'READY' %}<button class="video-gallery-preview" type="button" data-video-open data-video-url="{% url 'studio_api:asset_view' asset.id %}" data-video-title="{{ asset.original_filename }}" title="Play video"><video src="{% url 'studio_api:asset_view' asset.id %}" muted playsinline preload="metadata"></video><span aria-hidden="true">&#9654;</span></button>{% else %}<div class="video-gallery-processing"><i class="direct-media-spinner" aria-hidden="true"></i><span>{{ asset.get_processing_status_display }}</span></div>{% endif %}
      <figcaption><strong class="asset-name">{{ asset.original_filename }}</strong><small class="muted">{{ asset.created_at|date:'Y-m-d H:i' }} / {{ asset.created_by|display_name }}</small><div class="asset-actions"><a class="button icon-button secondary" href="{% url 'studio_api:asset_download' asset.id %}" download title="Download video" aria-label="Download video">&#8595;</a><form method="post" action="{% url 'studio:asset_star_toggle' asset.id %}" data-asset-star data-asset-id="{{ asset.id }}">{% csrf_token %}<button class="icon-button secondary{% if asset.is_starred %} active{% endif %}" type="submit" title="Favorite" aria-label="Favorite"><span>{% if asset.is_starred %}&#9733;{% else %}&#9734;{% endif %}</span></button></form>{% if video_gallery_mode == 'project' and asset.is_current_project %}<form method="post" action="{% url 'studio:asset_detach' asset.id 'project' project.id %}" data-ajax-asset-action>{% csrf_token %}<input type="hidden" name="asset_id" value="{{ asset.id }}"><button class="icon-button secondary" type="submit" title="Detach from project" aria-label="Detach from project">&#8722;</button></form>{% endif %}{% if asset.can_trash_from_workspace %}<form method="post" action="{% url 'studio:asset_trash' asset.id %}" data-asset-trash-form data-confirm="{% if asset.requires_usage_confirmation %}This video is used by several projects. Move it to Recycle Bin anyway?{% else %}Move this video to Recycle Bin?{% endif %}">{% csrf_token %}<input type="hidden" name="workspace_delete" value="1"><input type="hidden" name="confirm_usage" value="1"><input type="hidden" name="next" value="{{ request.get_full_path }}#{{ video_gallery_id|default:'videos' }}"><button class="icon-button secondary" type="submit" title="Move to Recycle Bin" aria-label="Move video to Recycle Bin">&#128465;</button></form>{% endif %}</div></figcaption>
      <template data-video-properties><dl class="asset-properties"><dt>Name</dt><dd>{{ asset.original_filename }}</dd><dt>Type</dt><dd>{{ asset.content_type }}</dd><dt>Size</dt><dd>{{ asset.size_bytes|filesizeformat }}</dd><dt>Resolution</dt><dd>{{ asset.width|default:'-' }}x{{ asset.height|default:'-' }}</dd><dt>Duration</dt><dd>{{ asset.duration_ms|default:0 }} ms</dd><dt>Status</dt><dd>{{ asset.get_processing_status_display }}</dd><dt>Workspace</dt><dd>{{ asset.workspace.name }}</dd><dt>Projects</dt><dd>{{ asset.gallery_project_names }}</dd><dt>Added</dt><dd>{{ asset.created_at|date:'Y-m-d H:i:s' }} by {{ asset.created_by|display_name }}</dd></dl></template>
    </figure>{% endfor %}
  </div></div>
</details>
<dialog class="confirmation-dialog video-library-dialog" data-video-dialog><div class="image-picker-head"><h2 data-video-dialog-title>Video</h2><button class="icon-button secondary" type="button" data-video-close aria-label="Close">&#x2715;</button></div><video controls playsinline preload="auto" data-video-player></video></dialog>
<dialog class="confirmation-dialog asset-properties-dialog" data-video-properties-dialog><button class="dialog-close" type="button" data-properties-close aria-label="Close">&times;</button><h2>File properties</h2><div data-properties-content></div></dialog>
<script>
(() => {
const videoGalleryEnhancerScript = document.currentScript;
setTimeout(() => {
  const library = document.getElementById("{{ video_gallery_id|default:'videos' }}");
  if (!library) return;
  const grid = library.querySelector("[data-video-grid]");
  const items = [...library.querySelectorAll("[data-video-item]")];
  const source = library.querySelector("[data-video-source]");
  const sort = library.querySelector("[data-video-sort]");
  const orientation = library.querySelector("[data-video-orientation]");
  const shape = library.querySelector("[data-video-shape]");
  const count = library.querySelector("[data-video-count]");
  const addTile = library.querySelector(".video-add-tile");
  const currentProject = library.dataset.currentProject;
  const recentIds = new Set(items.filter(item => item.dataset.projects.split(",").includes(currentProject)).slice(0, 10).map(item => item.dataset.assetId));
  const menu = videoGalleryEnhancerScript.nextElementSibling;
  let currentItem = null;
  const nativeShape = item => item.dataset.nativeOrientation === "portrait" ? "vertical" : item.dataset.nativeOrientation === "landscape" ? "horizontal" : "square";
  const apply = () => {
    const scope = source?.value || "workspace";
    const format = orientation?.value || "all";
    items.sort((a, b) => sort?.value === "alpha" ? a.dataset.name.localeCompare(b.dataset.name) : (sort?.value === "oldest" ? 1 : -1) * (Number(a.dataset.created) - Number(b.dataset.created)));
    items.forEach(item => {
      const projects = item.dataset.projects.split(",").filter(Boolean);
      const hiddenByScope = scope === "current" ? !projects.includes(currentProject) : scope === "workspace" ? false : scope === "recent" ? !recentIds.has(item.dataset.assetId) : scope === "starred" ? item.dataset.starred !== "1" : scope === "generated" ? item.dataset.generated !== "1" : !projects.includes(scope);
      item.hidden = hiddenByScope || (format !== "all" && nativeShape(item) !== format);
      item.dataset.previewShape = shape?.value && shape.value !== "auto" ? shape.value : nativeShape(item);
      grid.append(item);
    });
    if (addTile) grid.prepend(addTile);
    if (count) count.textContent = String(items.filter(item => !item.hidden).length);
  };
  [source, sort, orientation, shape].forEach(control => control?.addEventListener("change", apply));
  library.addEventListener("contextmenu", event => {
    const item = event.target.closest("[data-video-item]");
    if (item) currentItem = item;
  }, true);
  if (menu?.matches("[data-video-context]")) {
    const detach = menu.querySelector("[data-context-detach]");
    menu.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("contextmenu", event => {
      const item = event.target.closest("[data-video-item]");
      if (!item || !library.contains(item)) return;
      currentItem = item;
      if (detach) detach.hidden = !item.querySelector('form[action*="/detach/"]');
    }, true);
    if (detach) detach.onclick = () => {
      const form = currentItem?.querySelector('form[action*="/detach/"]');
      menu.hidden = true;
      form?.requestSubmit();
    };
  }
  apply();
}, 0);
})();
</script>
<div class="asset-context-menu" data-video-context hidden><button type="button" data-context-copy>Copy</button><a data-context-download download>Download</a><button type="button" data-context-detach>Detach from project</button><button type="button" data-context-delete>Move to Recycle Bin</button><button type="button" data-context-properties>Properties</button></div>
<script>(()=>{const menu=document.currentScript.previousElementSibling,propertiesDialog=menu.previousElementSibling.previousElementSibling,dialog=propertiesDialog.previousElementSibling,library=dialog.previousElementSibling;if(!library)return;const grid=library.querySelector('[data-video-grid]'),items=[...library.querySelectorAll('[data-video-item]')],addTile=library.querySelector('.video-add-tile'),source=library.querySelector('[data-video-source]'),sort=library.querySelector('[data-video-sort]'),shape=library.querySelector('[data-video-shape]'),count=library.querySelector('[data-video-count]'),player=dialog.querySelector('[data-video-player]'),current=library.dataset.currentProject;let contextItem=null;const apply=()=>{const scope=source?.value||'workspace';items.sort((a,b)=>sort.value==='alpha'?a.dataset.name.localeCompare(b.dataset.name):(sort.value==='oldest'?1:-1)*(Number(a.dataset.created)-Number(b.dataset.created))).forEach(item=>{item.hidden=scope==='current'?!item.dataset.projects.split(',').includes(current):scope==='starred'?item.dataset.starred!=='1':scope==='generated'?item.dataset.generated!=='1':false;item.dataset.orientation=shape?.value&&shape.value!=='auto'?shape.value:item.dataset.nativeOrientation;grid.appendChild(item)});if(addTile)grid.prepend(addTile);count.textContent=String(items.filter(item=>!item.hidden).length)};[source,sort,shape].forEach(control=>control?.addEventListener('change',apply));library.querySelectorAll('[data-video-open]').forEach(button=>button.addEventListener('click',()=>{dialog.querySelector('[data-video-dialog-title]').textContent=button.dataset.videoTitle;player.src=button.dataset.videoUrl;player.load();dialog.showModal()}));const close=()=>{player.pause();player.removeAttribute('src');player.load();dialog.close()};dialog.querySelectorAll('[data-video-close]').forEach(button=>button.addEventListener('click',close));dialog.addEventListener('cancel',event=>{event.preventDefault();close()});const showProperties=item=>{propertiesDialog.querySelector('[data-properties-content]').replaceChildren(item.querySelector('[data-video-properties]').content.cloneNode(true));propertiesDialog.showModal()};const hideMenu=()=>{menu.hidden=true;contextItem=null};items.forEach(item=>item.addEventListener('contextmenu',event=>{event.preventDefault();event.stopPropagation();contextItem=item;menu.style.left=`${Math.min(event.clientX,innerWidth-190)}px`;menu.style.top=`${Math.min(event.clientY,innerHeight-190)}px`;menu.hidden=false}));menu.querySelector('[data-context-copy]').onclick=async()=>{const url=contextItem?.querySelector('[data-video-open]')?.dataset.videoUrl;if(url)await navigator.clipboard.writeText(new URL(url,location.href).href);hideMenu()};menu.querySelector('[data-context-download]').onclick=event=>{const link=contextItem?.querySelector('a[download]');if(!link){event.preventDefault();return}event.currentTarget.href=link.href;hideMenu()};menu.querySelector('[data-context-delete]').onclick=()=>{const form=contextItem?.querySelector('[data-asset-trash-form]');hideMenu();form?.requestSubmit()};menu.querySelector('[data-context-properties]').onclick=()=>{const item=contextItem;hideMenu();if(item)showProperties(item)};document.addEventListener('pointerdown',event=>{if(!menu.hidden&&!menu.contains(event.target))hideMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape')hideMenu()});propertiesDialog.querySelector('[data-properties-close]').onclick=()=>propertiesDialog.close();library.querySelectorAll('video').forEach(video=>video.addEventListener('loadedmetadata',()=>{try{video.currentTime=Math.min(.12,video.duration||.12)}catch(_){}}));apply()})();</script>
