<details class="media-library video-library" id="{{ video_gallery_id|default:'videos' }}" data-video-library data-current-project="{{ project.id|default:'' }}" open>
  <summary class="media-library-toolbar"><span class="media-library-title"><span class="disclosure-icon" aria-hidden="true">&#9662;</span>{{ video_gallery_title|default:'Videos' }} <span class="media-count" data-video-count>{{ gallery_videos|length }}</span></span><span class="media-library-controls">
    {% if video_gallery_mode == 'project' %}<label class="compact-control">Source<select data-video-source><option value="current">Current Project</option><option value="workspace">Workspace</option><option value="starred">Favorite</option><option value="generated">Generated</option></select></label>{% endif %}
    <label class="compact-control">Sort<select data-video-sort><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="alpha">A-Z</option></select></label>
  </span></summary>
  <div class="project-section-body"><div class="asset-grid video-gallery-grid" data-video-grid>
  {% for asset in gallery_videos %}<figure class="asset video-gallery-card" data-video-item data-created="{{ asset.created_at|date:'U' }}" data-name="{{ asset.original_filename|lower }}" data-projects=",{{ asset.gallery_project_ids }}," data-starred="{% if asset.is_starred %}1{% else %}0{% endif %}" data-generated="{% if asset.kind == 'GENERATION_OUTPUT' %}1{% else %}0{% endif %}">
    <button class="video-gallery-preview" type="button" data-video-open data-video-url="{% url 'studio_api:asset_view' asset.id %}" data-video-title="{{ asset.original_filename }}" title="Play video"><video src="{% url 'studio_api:asset_view' asset.id %}" muted playsinline preload="metadata"></video><span aria-hidden="true">&#9654;</span></button>
    <figcaption><strong class="asset-name">{{ asset.original_filename }}</strong><small class="muted">{{ asset.created_at|date:'Y-m-d H:i' }} / {{ asset.created_by.get_full_name|default:asset.created_by.username }}</small><div class="asset-actions"><a class="button icon-button secondary" href="{% url 'studio_api:asset_download' asset.id %}" download title="Download video" aria-label="Download video">&#8595;</a><form method="post" action="{% url 'studio:asset_star_toggle' asset.id %}" data-asset-star data-asset-id="{{ asset.id }}">{% csrf_token %}<button class="icon-button secondary{% if asset.is_starred %} active{% endif %}" type="submit" title="{% if asset.is_starred %}Remove from Favorite{% else %}Favorite{% endif %}" aria-label="Favorite"><span>{% if asset.is_starred %}&#9733;{% else %}&#9734;{% endif %}</span></button></form>{% if video_gallery_mode == 'project' and asset.is_current_project %}<form method="post" action="{% url 'studio:asset_detach' asset.id 'project' project.id %}" data-ajax-asset-action>{% csrf_token %}<input type="hidden" name="asset_id" value="{{ asset.id }}"><button class="icon-button secondary" type="submit" title="Detach from project" aria-label="Detach from project">&#8722;</button></form>{% endif %}</div></figcaption>
  </figure>{% empty %}<p class="empty">No videos yet</p>{% endfor %}
  </div></div>
</details>
<dialog class="confirmation-dialog video-library-dialog" data-video-dialog><div class="image-picker-head"><h2 data-video-dialog-title>Video</h2><button class="icon-button secondary" type="button" data-video-close aria-label="Close">&#x2715;</button></div><video controls playsinline preload="auto" data-video-player></video><div class="dialog-actions"><button class="secondary" type="button" data-video-close>Close</button></div></dialog>
<script>(()=>{const library=document.currentScript.previousElementSibling.previousElementSibling,dialog=document.currentScript.previousElementSibling;if(!library||!dialog)return;const grid=library.querySelector('[data-video-grid]'),items=[...library.querySelectorAll('[data-video-item]')],source=library.querySelector('[data-video-source]'),sort=library.querySelector('[data-video-sort]'),count=library.querySelector('[data-video-count]'),player=dialog.querySelector('[data-video-player]'),current=library.dataset.currentProject;const apply=()=>{const scope=source?.value||'workspace';items.sort((a,b)=>sort.value==='alpha'?a.dataset.name.localeCompare(b.dataset.name):(sort.value==='oldest'?1:-1)*(Number(a.dataset.created)-Number(b.dataset.created))).forEach(item=>{item.hidden=scope==='current'?!item.dataset.projects.split(',').includes(current):scope==='starred'?item.dataset.starred!=='1':scope==='generated'?item.dataset.generated!=='1':false;grid.appendChild(item)});count.textContent=String(items.filter(item=>!item.hidden).length)};[source,sort].forEach(control=>control?.addEventListener('change',apply));library.querySelectorAll('[data-video-open]').forEach(button=>button.addEventListener('click',()=>{dialog.querySelector('[data-video-dialog-title]').textContent=button.dataset.videoTitle;player.src=button.dataset.videoUrl;player.load();dialog.showModal()}));const close=()=>{player.pause();player.removeAttribute('src');player.load();dialog.close()};dialog.querySelectorAll('[data-video-close]').forEach(button=>button.addEventListener('click',close));dialog.addEventListener('cancel',event=>{event.preventDefault();close()});library.querySelectorAll('video').forEach(video=>video.addEventListener('loadedmetadata',()=>{try{video.currentTime=Math.min(.12,video.duration||.12)}catch(_){}}));apply()})();</script>
