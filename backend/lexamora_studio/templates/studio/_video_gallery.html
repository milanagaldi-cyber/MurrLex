{% load studio_extras %}<details class="media-library video-library" id="{{ video_gallery_id|default:'videos' }}" data-video-library data-current-project="{{ project.id|default:'' }}" open>
  <summary class="media-library-toolbar"><span class="media-library-title"><span class="disclosure-icon" aria-hidden="true">&#9662;</span>{{ video_gallery_title|default:'Videos' }} <span class="media-count" data-video-count>{{ gallery_videos|length }}</span></span><span class="media-library-controls">
    {% if video_gallery_mode == 'project' %}<label class="compact-control">Source<select data-video-source><option value="current">Current Project</option><option value="workspace">Workspace</option><option value="starred">Favorite</option><option value="generated">Generated</option></select></label>{% endif %}
    <label class="compact-control">Sort<select data-video-sort><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="alpha">A-Z</option></select></label>
  </span></summary>
  <div class="project-section-body"><div class="asset-grid video-gallery-grid" data-video-grid>
  {% if can_edit %}<label class="asset-add-tile video-add-tile" title="Upload video"><span aria-hidden="true">+</span><small>Add Video</small><input type="file" accept="video/*" multiple data-direct-media-input hidden></label>{% endif %}
  {% for asset in gallery_videos %}<figure class="asset video-gallery-card" data-video-item data-asset-id="{{ asset.id }}" data-created="{{ asset.created_at|date:'U' }}" data-name="{{ asset.original_filename|lower }}" data-projects=",{{ asset.gallery_project_ids }}," data-starred="{% if asset.is_starred %}1{% else %}0{% endif %}" data-generated="{% if asset.kind == 'GENERATION_OUTPUT' %}1{% else %}0{% endif %}" title="{{ asset.width|default:'?' }}x{{ asset.height|default:'?' }} / {{ asset.size_bytes|filesizeformat }} / {{ asset.gallery_project_names }}"{% if video_gallery_mode == 'project' and not asset.is_current_project %} hidden{% endif %}>
    {% if asset.processing_status == 'READY' %}<button class="video-gallery-preview" type="button" data-video-open data-video-url="{% url 'studio_api:asset_view' asset.id %}" data-video-title="{{ asset.original_filename }}" title="Play video"><video src="{% url 'studio_api:asset_view' asset.id %}" muted playsinline preload="metadata"></video><span aria-hidden="true">&#9654;</span></button>{% else %}<div class="video-gallery-processing"><i class="direct-media-spinner" aria-hidden="true"></i><span>{{ asset.get_processing_status_display }}</span></div>{% endif %}
    <figcaption><strong class="asset-name">{{ asset.original_filename }}</strong><small class="muted">{{ asset.created_at|date:'Y-m-d H:i' }} / {{ asset.created_by|display_name }}</small><div class="asset-actions"><a class="button icon-button secondary" href="{% url 'studio_api:asset_download' asset.id %}" download title="Download video" aria-label="Download video">&#8595;</a><form method="post" action="{% url 'studio:asset_star_toggle' asset.id %}" data-asset-star data-asset-id="{{ asset.id }}">{% csrf_token %}<button class="icon-button secondary{% if asset.is_starred %} active{% endif %}" type="submit" title="Favorite" aria-label="Favorite"><span>{% if asset.is_starred %}&#9733;{% else %}&#9734;{% endif %}</span></button></form>{% if video_gallery_mode == 'project' and asset.is_current_project %}<form method="post" action="{% url 'studio:asset_detach' asset.id 'project' project.id %}" data-ajax-asset-action>{% csrf_token %}<input type="hidden" name="asset_id" value="{{ asset.id }}"><button class="icon-button secondary" type="submit" title="Detach from project" aria-label="Detach from project">&#8722;</button></form>{% endif %}{% if asset.can_trash_from_workspace %}<form method="post" action="{% url 'studio:asset_trash' asset.id %}" data-confirm="{% if asset.requires_usage_confirmation %}This video is used by several projects. Move it to Recycle Bin anyway?{% else %}Move this video to Recycle Bin?{% endif %}">{% csrf_token %}<input type="hidden" name="workspace_delete" value="1"><input type="hidden" name="confirm_usage" value="1"><input type="hidden" name="next" value="{{ request.get_full_path }}#{{ video_gallery_id|default:'videos' }}"><button class="icon-button secondary" type="submit" title="Move to Recycle Bin" aria-label="Move video to Recycle Bin">&#128465;</button></form>{% endif %}</div></figcaption>
    <template data-video-properties><dl class="asset-properties"><dt>Name</dt><dd>{{ asset.original_filename }}</dd><dt>Type</dt><dd>{{ asset.content_type }}</dd><dt>Size</dt><dd>{{ asset.size_bytes|filesizeformat }}</dd><dt>Resolution</dt><dd>{{ asset.width|default:'-' }}x{{ asset.height|default:'-' }}</dd><dt>Duration</dt><dd>{{ asset.duration_ms|default:0 }} ms</dd><dt>Status</dt><dd>{{ asset.get_processing_status_display }}</dd><dt>Workspace</dt><dd>{{ asset.workspace.name }}</dd><dt>Projects</dt><dd>{{ asset.gallery_project_names }}</dd><dt>Added</dt><dd>{{ asset.created_at|date:'Y-m-d H:i:s' }} by {{ asset.created_by|display_name }}</dd></dl></template>
  </figure>{% endfor %}
  </div></div>
</details>
<dialog class="confirmation-dialog video-library-dialog" data-video-dialog><div class="image-picker-head"><h2 data-video-dialog-title>Video</h2><button class="icon-button secondary" type="button" data-video-close aria-label="Close">&#x2715;</button></div><video controls playsinline preload="auto" data-video-player></video></dialog>
<dialog class="confirmation-dialog asset-properties-dialog" data-video-properties-dialog><button class="dialog-close" type="button" data-properties-close aria-label="Close">&times;</button><h2>File properties</h2><div data-properties-content></div></dialog>
<script>(()=>{const propertiesDialog=document.currentScript.previousElementSibling,dialog=propertiesDialog.previousElementSibling,library=dialog.previousElementSibling;if(!library)return;const grid=library.querySelector('[data-video-grid]'),items=[...library.querySelectorAll('[data-video-item]')],addTile=library.querySelector('.video-add-tile'),source=library.querySelector('[data-video-source]'),sort=library.querySelector('[data-video-sort]'),count=library.querySelector('[data-video-count]'),player=dialog.querySelector('[data-video-player]'),current=library.dataset.currentProject;const apply=()=>{const scope=source?.value||'workspace';items.sort((a,b)=>sort.value==='alpha'?a.dataset.name.localeCompare(b.dataset.name):(sort.value==='oldest'?1:-1)*(Number(a.dataset.created)-Number(b.dataset.created))).forEach(item=>{item.hidden=scope==='current'?!item.dataset.projects.split(',').includes(current):scope==='starred'?item.dataset.starred!=='1':scope==='generated'?item.dataset.generated!=='1':false;grid.appendChild(item)});if(addTile)grid.prepend(addTile);count.textContent=String(items.filter(item=>!item.hidden).length)};[source,sort].forEach(control=>control?.addEventListener('change',apply));library.querySelectorAll('[data-video-open]').forEach(button=>button.addEventListener('click',()=>{dialog.querySelector('[data-video-dialog-title]').textContent=button.dataset.videoTitle;player.src=button.dataset.videoUrl;player.load();dialog.showModal()}));const close=()=>{player.pause();player.removeAttribute('src');player.load();dialog.close()};dialog.querySelectorAll('[data-video-close]').forEach(button=>button.addEventListener('click',close));dialog.addEventListener('cancel',event=>{event.preventDefault();close()});items.forEach(item=>item.addEventListener('contextmenu',event=>{event.preventDefault();propertiesDialog.querySelector('[data-properties-content]').replaceChildren(item.querySelector('[data-video-properties]').content.cloneNode(true));propertiesDialog.showModal()}));propertiesDialog.querySelector('[data-properties-close]').onclick=()=>propertiesDialog.close();library.querySelectorAll('video').forEach(video=>video.addEventListener('loadedmetadata',()=>{try{video.currentTime=Math.min(.12,video.duration||.12)}catch(_){}}));apply()})();</script>
