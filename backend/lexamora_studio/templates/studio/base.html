<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Lexamora Studio{% endblock %}</title>
<script>
(() => {
  try {
    const theme = localStorage.getItem("theme");
    document.documentElement.dataset.theme = ["dark","light"].includes(theme) ? theme : "dark";
  } catch (_) { document.documentElement.dataset.theme = "dark"; }
})();
</script>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#111821;--panel-2:#151e29;--ink:#edf5ff;--muted:#93a4b8;--line:#263241;--accent:#18b7ff;--accent-strong:#65d8ff;--good:#42e68a;--warn:#f2c94c;--danger:#ff6b6b;--input-bg:#0e141c;--button-ink:#03111a;--hover:#fff;--focus:rgba(24,183,255,.35);--shadow:0 18px 50px rgba(0,0,0,.38)}
html[data-theme="light"]{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--panel-2:#eaf2f8;--ink:#122033;--muted:#53657a;--line:#c9d4df;--accent:#087eaf;--accent-strong:#05658e;--good:#198754;--warn:#9a6700;--danger:#c0392b;--input-bg:#fff;--button-ink:#fff;--hover:#003f5c;--focus:rgba(8,126,175,.28);--shadow:0 18px 50px rgba(18,32,51,.18)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}a{color:var(--accent-strong);font-weight:750;text-decoration:none}a:hover{color:var(--hover)}p{color:var(--muted);line-height:1.55}h1{font-size:28px;margin:0 0 20px}h2{font-size:19px;margin:26px 0 12px}h3{margin-top:0}.site-header{border-bottom:1px solid var(--line);background:var(--panel)}.topbar{width:min(1240px,calc(100% - 32px));min-height:66px;margin:auto;display:flex;align-items:center;gap:18px}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-weight:850}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--accent);border-radius:8px;color:var(--accent-strong);font:700 12px Consolas,monospace}.topbar nav{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.nav-link,.theme-toggle{display:inline-flex;align-items:center;min-height:36px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font:700 14px inherit;cursor:pointer}.nav-link:hover,.theme-toggle:hover{border-color:var(--line);background:var(--panel-2);color:var(--ink)}.nav-back{border-color:var(--line);color:var(--ink)}main{width:min(1240px,calc(100% - 32px));margin:auto;padding:28px 0 64px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.toolbar>div:last-child{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button,button{display:inline-flex;min-height:38px;align-items:center;justify-content:center;padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--button-ink);font:750 14px inherit;text-decoration:none;cursor:pointer}.button:hover,button:hover{filter:brightness(1.08);color:var(--button-ink)}.button.secondary,button.secondary{background:transparent;color:var(--accent-strong)}.panel,.list,.master-document,.generation-card,.comparison-card,.roundtrip-summary{background:var(--panel);border:1px solid var(--line);border-radius:7px}.notice{padding:11px 14px;margin-bottom:14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--panel)}.list{overflow:hidden}.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(160px,.65fr) 130px;gap:16px;align-items:center;min-height:58px;padding:11px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row a{color:var(--ink)}.muted,.empty{color:var(--muted)}label{display:block;margin:0 0 6px;font-weight:700}input,textarea,select{width:100%;max-width:760px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--input-bg);color:var(--ink);font:inherit}input:focus,textarea:focus,select:focus{outline:3px solid var(--focus);border-color:var(--accent)}textarea{resize:vertical}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.asset{margin:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);overflow:hidden}.asset img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}.asset figcaption{padding:11px;overflow-wrap:anywhere}.asset-preview-trigger{display:block}.master-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px}.master-toc{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 36px);overflow:auto;padding:14px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.master-toc a{color:var(--muted)}.master-toc .toc-scene{padding-left:14px}.master-section{padding:26px;border-bottom:1px solid var(--line);scroll-margin-top:20px}.scene-section{padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:20px}.master-item{padding:16px 0;border-top:1px solid var(--line)}.item-heading,.dialogue-line{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.order{display:flex;align-items:center;gap:5px;flex-shrink:0}.order form{margin:0}.order button{width:34px;height:34px;padding:0;border-color:var(--line);background:transparent;color:var(--ink)}.scene-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.dialogue-line,.prompt-block{padding:10px 0;border-top:1px solid var(--line)}.metadata{display:grid;grid-template-columns:150px 1fr;gap:8px 16px}.metadata dt{font-weight:700}.metadata dd{margin:0}.generation-card{margin:18px 0;padding:20px}.badge-status{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px}.generation-results{margin-top:18px}.final-output{border:2px solid var(--accent)}.roundtrip-summary{padding:16px 18px;margin-bottom:20px;border-left-width:5px}.roundtrip-summary.same{border-left-color:var(--good)}.roundtrip-summary.changed{border-left-color:var(--warn)}.comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.comparison-card{min-width:0;padding:18px}.comparison-card.wide{grid-column:1/-1}.comparison-card h2{display:flex;justify-content:space-between;gap:12px;margin-top:0}.comparison-status{font-size:13px}.comparison-status.same{color:var(--good)}.comparison-status.changed{color:var(--warn)}.comparison-table{width:100%;border-collapse:collapse}.comparison-table th,.comparison-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.diff{max-height:360px;overflow:auto;padding:12px;background:#080b0f;color:#eee;font-size:12px;white-space:pre-wrap}.split-list{display:grid;grid-template-columns:1fr 1fr;gap:18px}.split-list code{display:block;margin-top:8px;overflow-wrap:anywhere}.prompt-fieldset{margin:0;padding:0;border:0;min-width:0}.prompt-fieldset:disabled{opacity:.78}.prompt-stack{display:grid;gap:16px}.prompt-editor{padding:18px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.prompt-editor-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.prompt-meta-grid{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:10px}.prompt-content-row{margin:12px 0}.prompt-content-row select{max-width:240px;margin-bottom:6px}.inline-add{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:6px}.inline-add summary,.quick-create summary{cursor:pointer;font-weight:800}.prompt-assets{margin-top:14px}.prompt-image-upload{display:flex;align-items:flex-end;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.prompt-image-upload label{flex:1}.prompt-image-upload .drop-zone{padding:12px;text-align:left}.quick-create{margin:18px 0;padding:18px}.quick-create form{margin-top:16px}.scene-chain{display:grid;gap:18px}.episode-chain{display:grid;gap:12px}.scene-chain-card{position:relative;padding:18px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.scene-chain-card.dragging{opacity:.45}.scene-chain-card.drag-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}.drag-handle{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--muted);cursor:grab;user-select:none}.scene-chain-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.scene-chain-layout{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:18px}.scene-chain-image .asset:not(:first-child){display:none}.scene-chain-image img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}.scene-edit-grid{display:grid;grid-template-columns:100px 1fr 160px;gap:10px}.scene-edit-grid .wide{grid-column:1/-1}.save-state{font-size:13px;color:var(--muted)}.drop-zone{max-width:760px;padding:28px;border:2px dashed var(--line);border-radius:8px;background:var(--panel);text-align:center;transition:.15s}.drop-zone.dragover{border-color:var(--accent);background:var(--panel-2)}.drop-zone input[type=file]{max-width:100%;margin-top:12px}.image-modal[hidden],.context-menu[hidden]{display:none}.image-modal{position:fixed;inset:0;z-index:1000;display:grid;grid-template-rows:auto 1fr;background:rgba(0,0,0,.88)}.image-modal-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;color:#fff}.image-modal img{display:block;max-width:96vw;max-height:88vh;margin:auto;object-fit:contain}.context-menu{position:fixed;z-index:1100;min-width:190px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:var(--shadow)}.context-menu button{display:block;width:100%;min-height:34px;padding:7px 10px;border:0;background:transparent;color:var(--ink);text-align:left}.context-menu button:hover{background:var(--panel-2)}@media(max-width:820px){.prompt-meta-grid,.scene-chain-layout,.scene-edit-grid{grid-template-columns:1fr}.scene-edit-grid .wide{grid-column:auto}.master-layout{grid-template-columns:1fr}.master-toc{position:static;max-height:none}.scene-facts{grid-template-columns:1fr}}@media(max-width:680px){.comparison-grid,.split-list{grid-template-columns:1fr}.comparison-card.wide{grid-column:auto}.topbar{align-items:flex-start;padding:10px 0;flex-direction:column}.topbar nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}.nav-link{white-space:nowrap}.row{grid-template-columns:1fr;gap:4px}.toolbar{align-items:flex-start;flex-direction:column}}@media print{.site-header,.master-toc,.master-document .order,.toolbar{display:none!important}main{width:100%;padding:0}.master-layout{display:block}.master-document{border:0}.master-section{break-inside:avoid;padding:18px 0}}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header class="site-header"><div class="topbar"><a class="brand" href="{% url 'studio:dashboard' %}"><span class="brand-mark">LS</span><span>Lexamora Studio</span></a><nav aria-label="Studio navigation"><a class="nav-link nav-back" href="{% url 'studio:dashboard' %}" onclick="if(history.length>1){history.back();return false}">&larr; Back</a><a class="nav-link" href="{% url 'studio:dashboard' %}">Studio home</a><a class="nav-link" href="{% url 'apps_dashboard' %}">MurrLex Apps</a><a class="nav-link" href="{% url 'account' %}">Account</a><button class="theme-toggle" type="button" data-theme-toggle title="Switch theme">Theme</button></nav></div></header>
<main>{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
<div class="image-modal" data-image-modal hidden><div class="image-modal-bar"><strong data-image-title>Image</strong><button type="button" class="secondary" data-image-close>Close</button></div><img data-image-full alt=""></div>
<div class="context-menu" data-image-menu hidden><button type="button" data-action="download">Download</button><button type="button" data-action="new-tab">Open in new tab</button><button type="button" data-action="copy-url">Copy URL</button></div>
<script>
(() => {
  const themeButton=document.querySelector("[data-theme-toggle]");
  const updateTheme=()=>{const t=document.documentElement.dataset.theme||"dark";themeButton.textContent=t==="dark"?"Light theme":"Dark theme"};
  themeButton?.addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("theme",next)}catch(_){}updateTheme()});updateTheme();

  document.querySelectorAll('input[type="file"]').forEach(input=>{
    if(input.closest(".drop-zone"))return;
    const zone=document.createElement("div");zone.className="drop-zone";
    const hint=document.createElement("div");hint.innerHTML="<strong>Drop file here</strong><br><span class='muted'>or choose a file from your computer</span>";
    input.parentNode.insertBefore(zone,input);zone.append(hint,input);
    ["dragenter","dragover"].forEach(name=>zone.addEventListener(name,e=>{e.preventDefault();zone.classList.add("dragover")}));
    ["dragleave","drop"].forEach(name=>zone.addEventListener(name,e=>{e.preventDefault();zone.classList.remove("dragover")}));
    zone.addEventListener("drop",e=>{if(e.dataTransfer.files.length){const transfer=new DataTransfer();[...e.dataTransfer.files].forEach(file=>transfer.items.add(file));input.files=transfer.files;hint.innerHTML="<strong>"+input.files[0].name+"</strong><br><span class='muted'>Ready to upload</span>"}});
    input.addEventListener("change",()=>{if(input.files[0])hint.innerHTML="<strong>"+input.files[0].name+"</strong><br><span class='muted'>Ready to upload</span>"});
  });

  const modal=document.querySelector("[data-image-modal]"),full=modal.querySelector("[data-image-full]"),title=modal.querySelector("[data-image-title]"),menu=document.querySelector("[data-image-menu]");
  let current=null;
  const assetData=img=>{const link=img.closest("a");const figure=img.closest(".asset");return{url:link?.href||img.src,download:figure?.querySelector('a[href*="/download"]')?.href||link?.href||img.src,title:img.alt||"Image"}};
  const close=()=>{modal.hidden=true;full.removeAttribute("src")};
  document.querySelectorAll(".asset img").forEach(img=>{
    const link=img.closest("a");if(link){link.classList.add("asset-preview-trigger");link.removeAttribute("target");link.addEventListener("auxclick",e=>e.preventDefault())}
    img.addEventListener("click",e=>{e.preventDefault();current=assetData(img);full.src=current.url;title.textContent=current.title;modal.hidden=false});
    img.addEventListener("contextmenu",e=>{e.preventDefault();current=assetData(img);menu.style.left=Math.min(e.clientX,innerWidth-210)+"px";menu.style.top=Math.min(e.clientY,innerHeight-130)+"px";menu.hidden=false});
  });
  modal.querySelector("[data-image-close]").addEventListener("click",close);modal.addEventListener("click",e=>{if(e.target===modal)close()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){close();menu.hidden=true}});
  document.addEventListener("click",e=>{if(!e.target.closest("[data-image-menu]"))menu.hidden=true});
  menu.addEventListener("click",async e=>{const action=e.target.dataset.action;if(!action||!current)return;if(action==="download")location.href=current.download;if(action==="new-tab")window.open(current.url,"_blank","noopener");if(action==="copy-url"){try{await navigator.clipboard.writeText(current.url)}catch(_){const box=document.createElement("textarea");box.value=current.url;document.body.appendChild(box);box.select();document.execCommand("copy");box.remove()}}menu.hidden=true});
})();
</script>
{% block extra_script %}{% endblock %}
</body></html>
