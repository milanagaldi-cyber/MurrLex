<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Lexamora Studio{% endblock %}</title>
<style>
:root{--ink:#17211d;--muted:#64706a;--line:#d9dfdb;--accent:#187c62;--paper:#f6f8f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}header{height:58px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);background:#fff}header a{color:inherit;text-decoration:none}header nav{margin-left:auto}main{max-width:1180px;margin:auto;padding:28px 24px 60px}h1{font-size:28px;margin:0 0 20px;letter-spacing:0}h2{font-size:18px;margin:26px 0 12px;letter-spacing:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.button{display:inline-flex;min-height:38px;align-items:center;padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;text-decoration:none;cursor:pointer}.button.secondary{background:#fff;color:var(--accent)}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.asset{margin:0;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}.asset img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.asset figcaption{padding:10px;overflow-wrap:anywhere}.notice{padding:10px 12px;margin-bottom:14px;border-left:3px solid var(--accent);background:#fff}.list{border-top:1px solid var(--line);background:#fff}.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(160px,.5fr) 110px;gap:16px;align-items:center;min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line)}.row a{color:var(--ink);font-weight:650;text-decoration:none}.muted,.empty{color:var(--muted)}label{display:block;margin-bottom:6px;font-weight:650}input,textarea,select{width:100%;max-width:680px;padding:10px;border:1px solid #aeb8b2;border-radius:5px;font:inherit}@media(max-width:680px){.row{grid-template-columns:1fr;gap:4px}main{padding:20px 14px}}
</style>
</head>
<body><header><a href="{% url 'studio:dashboard' %}"><strong>Lexamora Studio</strong></a><nav><a href="{% url 'account' %}">Account</a></nav></header><main>{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body>
</html>
