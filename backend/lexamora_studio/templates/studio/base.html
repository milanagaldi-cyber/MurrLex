<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Lexamora Studio{% endblock %}</title>
<style>
:root{--ink:#17211d;--muted:#64706a;--line:#d9dfdb;--accent:#187c62;--paper:#f6f8f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}header{min-height:58px;display:flex;align-items:center;gap:18px;padding:10px 24px;border-bottom:1px solid var(--line);background:#fff}header a{color:inherit;text-decoration:none}header nav{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nav-link{display:inline-flex;align-items:center;min-height:34px;padding:6px 10px;border-radius:5px;color:var(--muted)}.nav-link:hover,.nav-link:focus{background:var(--paper);color:var(--ink)}.nav-back{border:1px solid var(--line);color:var(--ink)}main{max-width:1180px;margin:auto;padding:28px 24px 60px}h1{font-size:28px;margin:0 0 20px;letter-spacing:0}h2{font-size:18px;margin:26px 0 12px;letter-spacing:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.button{display:inline-flex;min-height:38px;align-items:center;padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;text-decoration:none;cursor:pointer}.button.secondary{background:#fff;color:var(--accent)}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.asset{margin:0;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}.asset img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.asset figcaption{padding:10px;overflow-wrap:anywhere}.notice{padding:10px 12px;margin-bottom:14px;border-left:3px solid var(--accent);background:#fff}.list{border-top:1px solid var(--line);background:#fff}.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(160px,.5fr) 110px;gap:16px;align-items:center;min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line)}.row a{color:var(--ink);font-weight:650;text-decoration:none}.muted,.empty{color:var(--muted)}label{display:block;margin-bottom:6px;font-weight:650}input,textarea,select{width:100%;max-width:680px;padding:10px;border:1px solid #aeb8b2;border-radius:5px;font:inherit}.master-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}.master-toc{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 36px);overflow:auto}.master-toc a{color:var(--ink);text-decoration:none}.master-toc .toc-scene{padding-left:14px;color:var(--muted)}.master-document{min-width:0;background:#fff;border:1px solid var(--line)}.master-section{padding:26px;border-bottom:1px solid var(--line);scroll-margin-top:20px}.scene-section{padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:20px}.master-item{padding:16px 0;border-top:1px solid var(--line)}.item-heading,.dialogue-line{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.order{display:flex;align-items:center;gap:5px;flex-shrink:0}.order form{margin:0}.order button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}.scene-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.dialogue-line,.prompt-block{padding:10px 0;border-top:1px solid var(--line)}.metadata{display:grid;grid-template-columns:150px 1fr;gap:8px 16px}.metadata dt{font-weight:700}.metadata dd{margin:0}.generation-card{margin:18px 0;padding:20px;border:1px solid var(--line);border-radius:6px;background:#fff}.generation-card h3{margin:0 0 5px}.badge-status{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px}.generation-results{margin-top:18px}.final-output{border:2px solid var(--accent)}@media(max-width:820px){.master-layout{grid-template-columns:1fr}.master-toc{position:static;max-height:none}.scene-facts{grid-template-columns:1fr}}@media(max-width:680px){header{align-items:flex-start;padding:10px 14px;gap:8px;flex-direction:column}header nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}.nav-link{white-space:nowrap}.row{grid-template-columns:1fr;gap:4px}main{padding:20px 14px}}
@media print{header,.master-toc,.master-document .order,.toolbar{display:none!important}main{max-width:none;padding:0}.master-layout{display:block}.master-document{border:0}.master-section{break-inside:avoid;padding:18px 0}}
</style>
</head>
<body><header><a href="{% url 'studio:dashboard' %}"><strong>Lexamora Studio</strong></a><nav aria-label="Studio navigation"><a class="nav-link nav-back" href="{% url 'studio:dashboard' %}" onclick="if (window.history.length > 1) { window.history.back(); return false; }">&larr; Back</a><a class="nav-link" href="{% url 'studio:dashboard' %}">Studio home</a><a class="nav-link" href="{% url 'apps_dashboard' %}">MurrLex Apps</a><a class="nav-link" href="{% url 'account' %}">Account</a></nav></header><main>{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body>
</html>
