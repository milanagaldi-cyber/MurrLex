<div class="asset-actions" aria-label="Image actions">
  <a class="icon-button" href="{% url 'studio_api:asset_download' asset.id %}" title="Download" aria-label="Download"><span aria-hidden="true">&#x2913;</span></a>
  <button class="icon-button" type="button" data-copy-url="{% url 'studio_api:asset_view' asset.id %}" title="Copy URL" aria-label="Copy URL"><span aria-hidden="true">&#x1F517;</span></button>
  {% if can_edit %}{% if attachment_scope %}
  <form method="post" action="{% url 'studio:asset_detach' asset.id attachment_scope attachment_id %}" data-confirm="Detach this image here? The file will remain in the Workspace library.">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}#{{ return_anchor|default:'images' }}"><button class="icon-button" type="submit" title="Detach image" aria-label="Detach image"><span aria-hidden="true">&#x2715;</span></button></form>
  {% elif allow_trash %}
  {% if asset.can_trash_from_workspace %}<form method="post" action="{% url 'studio:asset_trash' asset.id %}" data-confirm="{% if asset.requires_usage_confirmation %}This image is used multiple times or by several projects. Move it to Recycle Bin anyway?{% else %}Move this image to Recycle Bin?{% endif %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="workspace_delete" value="1"><input type="hidden" name="confirm_usage" value="1"><button class="icon-button" type="submit" title="Move to Recycle Bin" aria-label="Move to Recycle Bin"><span aria-hidden="true">&#x1F5D1;</span></button></form>{% else %}<button class="icon-button disabled" type="button" title="Cannot delete: this image is used by a project you cannot access" aria-label="Cannot delete this image" disabled><span aria-hidden="true">&#x1F5D1;</span></button>{% endif %}
  {% endif %}{% endif %}
</div>
