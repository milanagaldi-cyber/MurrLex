<div class="asset-actions" aria-label="Image actions" data-asset-info="{{ asset.original_filename }} | {{ asset.get_kind_display }} | {{ asset.content_type }} | {{ asset.width }}x{{ asset.height }} | {{ asset.size_bytes }} bytes | Added {{ asset.created_at|date:'Y-m-d H:i' }}">
  <a class="icon-button asset-action-icon" href="{% url 'studio_api:asset_download' asset.id %}" title="Download" aria-label="Download"><span aria-hidden="true">&#8595;</span></a>
  <button class="icon-button asset-action-icon" type="button" data-copy-url="{% url 'studio_api:asset_view' asset.id %}" title="Copy URL" aria-label="Copy URL"><span aria-hidden="true">&#x29C9;</span></button>
  {% if can_edit %}{% if attachment_scope %}
  <form method="post" action="{% url 'studio:asset_detach' asset.id attachment_scope attachment_id %}" data-confirm="Detach this image here? The file will remain in the Workspace library.">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}#{{ return_anchor|default:'images' }}"><button class="icon-button asset-action-icon" type="submit" title="Detach image" aria-label="Detach image"><span aria-hidden="true">&minus;</span></button></form>
  {% elif attach_project_id %}
  <form method="post" action="{% url 'studio:asset_attach' 'project' attach_project_id %}">{% csrf_token %}<input type="hidden" name="asset_id" value="{{ asset.id }}"><input type="hidden" name="next" value="{{ request.get_full_path }}#{{ return_anchor|default:'images' }}"><button class="icon-button asset-action-icon" type="submit" title="Attach image to project" aria-label="Attach image to project"><span aria-hidden="true">+</span></button></form>
  {% elif allow_trash %}
  {% if asset.can_trash_from_workspace %}<form method="post" action="{% url 'studio:asset_trash' asset.id %}" data-confirm="{% if asset.requires_usage_confirmation %}This image is used multiple times or by several projects. Move it to Recycle Bin anyway?{% else %}Move this image to Recycle Bin?{% endif %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="workspace_delete" value="1"><input type="hidden" name="confirm_usage" value="1"><button class="icon-button asset-action-icon" type="submit" title="Move to Recycle Bin" aria-label="Move to Recycle Bin"><span aria-hidden="true">&#x25A3;</span></button></form>{% else %}<button class="icon-button asset-action-icon disabled" type="button" title="Cannot delete: this image is used by a project you cannot access" aria-label="Cannot delete this image" disabled><span aria-hidden="true">&#x25A3;</span></button>{% endif %}
  {% endif %}{% endif %}
</div>
