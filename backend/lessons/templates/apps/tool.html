{% extends "apps/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block app_content %}<section class="panel" style="max-width:820px;margin:0 auto;"><h1>{{ title }}</h1><form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}{{ form.as_p }}<button type="submit">Run</button></form>{% if output %}<h2>Result</h2><textarea rows="10" readonly>{{ output }}</textarea>{% endif %}{% if audio_data %}<h2>Result</h2><audio controls autoplay src="{{ audio_data }}"></audio>{% endif %}</section>{% endblock %}
