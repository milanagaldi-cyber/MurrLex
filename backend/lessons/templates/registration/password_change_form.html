<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MurrLex Change Password</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: #ffffff;
            --ink: #18202f;
            --muted: #5f6d80;
            --line: #dce4ef;
            --accent: #1d6f9f;
            --danger: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
            color: var(--ink);
        }
        .panel {
            width: min(460px, calc(100% - 32px));
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
        }
        h1 { margin: 0 0 10px; }
        p { color: var(--muted); line-height: 1.45; }
        label { display: block; margin: 14px 0 6px; font-weight: 650; }
        input {
            width: 100%;
            border: 1px solid #cfd8d0;
            border-radius: 8px;
            padding: 11px 12px;
            font: inherit;
        }
        button {
            margin-top: 18px;
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 750;
            cursor: pointer;
        }
        a { color: var(--accent); font-weight: 750; text-decoration: none; }
        .errors {
            margin: 10px 0 0;
            color: var(--danger);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Change password</h1>
        <p>Choose a new password for your MurrLex account.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="errors">{{ field.errors }}</div>
                {% endif %}
            {% endfor %}
            <button type="submit">Change password</button>
        </form>
        <p><a href="{% url 'account_settings' %}">Back to settings</a></p>
    </main>
</body>
</html>
