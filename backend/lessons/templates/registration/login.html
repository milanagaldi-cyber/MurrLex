<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Make Mistake Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f7f3;
            color: #1d2721;
        }
        .panel {
            width: min(420px, calc(100% - 32px));
            background: #fff;
            border: 1px solid #dde4dc;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(24, 45, 32, 0.08);
        }
        h1 { margin: 0 0 18px; }
        label { display: block; margin: 14px 0 6px; font-weight: 650; }
        input {
            width: 100%;
            border: 1px solid #cfd8d0;
            border-radius: 12px;
            padding: 11px 12px;
            font: inherit;
        }
        button {
            margin-top: 18px;
            border: 0;
            border-radius: 14px;
            padding: 11px 16px;
            background: #2c3f35;
            color: #fff;
            font-weight: 750;
            cursor: pointer;
        }
        .error {
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff0ee;
            color: #b42318;
            border: 1px solid #ffd1cc;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Make Mistake Lab</h1>
        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
