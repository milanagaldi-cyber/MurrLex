openapi: 3.1.0
info:
  title: Make Mistake Import API
  version: 0.1.0
  description: Internal API for saving Make Mistake lesson JSON into the Django backend.
servers:
  - url: https://YOUR-TUNNEL-URL
    description: Replace with your HTTPS tunnel URL, for example an ngrok or Cloudflare Tunnel URL.
paths:
  /api/health:
    get:
      operationId: healthCheck
      summary: Check that the Make Mistake backend is reachable.
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: make-mistake-backend
  /api/internal/import-lesson:
    post:
      operationId: importLesson
      summary: Import one Make Mistake lesson JSON object.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonImportPayload"
      responses:
        "200":
          description: Lesson imported successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - lessonId
                  - cardsImported
                properties:
                  status:
                    type: string
                    example: ok
                  lessonId:
                    type: string
                    example: connector-sample-lesson
                  cardsImported:
                    type: integer
                    example: 2
        "400":
          description: Invalid JSON or lesson payload.
        "401":
          description: Missing or invalid bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LessonImportPayload:
      type: object
      required:
        - id
        - title
        - cards
      properties:
        id:
          type: string
          description: External lesson identifier.
        title:
          type: string
          description: Human-readable lesson title.
        timesCompleted:
          type: integer
          description: Optional mobile-app completion counter.
        editable:
          type: boolean
          description: Optional mobile-app editability flag.
        cardKind:
          type: string
          description: MK for mistakes, LN for regular lesson cards.
          enum:
            - MK
            - LN
        sourceLanguage:
          type: string
          description: Source language name for LN cards.
        targetLanguage:
          type: string
          description: Target language name for LN cards.
        cards:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CardPayload"
    CardPayload:
      type: object
      required:
        - id
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
        nativeValue:
          type: string
        correctValue:
          type: string
        wrongAnswers:
          type: array
          items:
            type: object
        hint:
          type: string
        madeAt:
          type: string
        where:
          type: string
        log:
          type: array
          items:
            type: string
        mistake:
          type: string
        type:
          type: string
        cardKind:
          type: string
          enum:
            - MK
            - LN
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        stars:
          type: integer
          minimum: 0
          maximum: 3
