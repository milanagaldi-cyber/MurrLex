# The existing wg0-only firewall remains mandatory for this port.
server {
    listen 8445 ssl;
    server_name ml-staging-api.lexaailabs.com;
    ssl_certificate /etc/letsencrypt/live/ml-staging-api.lexaailabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ml-staging-api.lexaailabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 10.0.0.0/24;
    deny all;
    client_max_body_size 40m;
    access_log /var/log/nginx/odpaniewy-access.log;
    error_log /var/log/nginx/odpaniewy-error.log;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    if ($host != ml-staging-api.lexaailabs.com) { return 444; }
    location = /xmlrpc.php { return 403; }
    location = /wp-config.php { return 404; }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host ml-staging-api.lexaailabs.com:8445;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
