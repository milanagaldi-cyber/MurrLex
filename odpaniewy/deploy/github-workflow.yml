name: Deploy odpaniewy
on:
  push:
    branches: [odpaniewy]
    paths: ['odpaniewy/**', '.github/workflows/deploy-odpaniewy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpaniewy-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: odp-ci-only
          MARIADB_DATABASE: odp_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Verify shop branch
        run: test "$GITHUB_REF_NAME" = odpaniewy
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test shop
        working-directory: odpaniewy
        run: node --test tests/*.test.mjs
      - name: Validate WordPress PHP and deployment scripts
        working-directory: odpaniewy
        run: |
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n wordpress/deploy/odpaniewy-woo-deploy
          bash -n wordpress/tests/ci.sh
      - name: Test management and storefront with disposable WordPress and WooCommerce
        working-directory: odpaniewy
        run: bash wordpress/tests/ci.sh
      - name: Verify preview is unreachable outside Team VPN
        run: |
          curl --fail --silent --show-error --max-time 15 https://ml-staging-api.lexaailabs.com/api/health > /dev/null
          for path in szczoteczki wp-admin/ wp-json/wc/store/v1/products assets/hero-fixed.png; do
            status=0
            curl --ipv4 --silent --show-error --connect-timeout 5 --max-time 6 -o /dev/null "https://ml-staging-api.lexaailabs.com:8445/$path" || status=$?
            case "$status" in
              7|28) echo "Public access blocked: $path" ;;
              *) echo "Unexpected public response, curl status $status: $path"; exit 1 ;;
            esac
          done
          status=0
          curl --ipv4 --silent --show-error --connect-timeout 5 --max-time 6 -o /dev/null http://ml-staging-api.lexaailabs.com:18085/ || status=$?
          case "$status" in
            7|28) echo 'Internal WordPress port is not publicly reachable' ;;
            *) echo "Unexpected public WordPress backend response: $status"; exit 1 ;;
          esac
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure shop-only key
        env:
          DEPLOY_KEY: ${{ secrets.ODP_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo 'Add repository secret ODP_SSH_PRIVATE_KEY first.'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/odpaniewy
          chmod 600 ~/.ssh/odpaniewy
          printf '%s\n' 'ml-staging-api.lexaailabs.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOw1Aolwl5ND3zKwREHki8SamricZZmGv6Hb9ANzUAS+' > ~/.ssh/known_hosts
      - name: Deploy isolated shop
        run: ssh -i ~/.ssh/odpaniewy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes odpaniewy-deploy@ml-staging-api.lexaailabs.com "deploy $GITHUB_SHA"
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/odpaniewy
