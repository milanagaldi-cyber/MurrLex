# Dedicated port; firewall only permits wg0. Do not add public asset aliases.
server {
    listen 8445 ssl;
    server_name ml-staging-api.lexaailabs.com;
    ssl_certificate /etc/letsencrypt/live/ml-staging-api.lexaailabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ml-staging-api.lexaailabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 10.0.0.0/24;
    deny all;
    client_max_body_size 8k;
    access_log /var/log/nginx/odpaniewy-access.log;
    error_log /var/log/nginx/odpaniewy-error.log;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    if ($host != ml-staging-api.lexaailabs.com) { return 444; }
    location / {
        proxy_pass http://unix:/run/odpaniewy/app.sock;
        proxy_http_version 1.1;
        proxy_set_header Host ml-staging-api.lexaailabs.com:8445;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
